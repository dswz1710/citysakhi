<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>CitySakhi — Manual Canva Logo</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#F7F3E8}
#logo-page{position:relative;width:500px;height:500px;overflow:hidden;background:#F7F3E8;font-family:Arial,sans-serif}
.shape{position:absolute}
.pin-point{left:181px;top:81px;width:138px;height:138px;background:#244C3B;border-radius:50% 50% 50% 0;transform:rotate(-45deg)}
.pin-inner{left:220px;top:105px;width:60px;height:60px;background:#F7F3E8;border-radius:50%}
.door-frame{left:229px;top:118px;width:42px;height:55px;background:#D88463;border-radius:22px 22px 2px 2px}
.door-opening{left:239px;top:130px;width:22px;height:43px;background:#F7F3E8;border-radius:12px 12px 0 0}
.path-dot{left:242px;top:186px;width:16px;height:16px;border-radius:50%;background:#D88463}
.word-city{position:absolute;left:64px;top:275px;width:220px;font-size:58px;line-height:1.05;font-weight:700;letter-spacing:-2px;color:#244C3B;text-align:right}
.word-sakhi{position:absolute;left:282px;top:275px;width:160px;font-size:58px;line-height:1.05;font-weight:700;letter-spacing:-2px;color:#D88463;text-align:left}
.tagline{position:absolute;left:30px;top:354px;width:440px;text-align:center;font-size:15px;font-weight:700;letter-spacing:2.5px;color:#5B6F63}
</style></head>
<body>
<div id="logo-page" data-document-role="page" data-label="CitySakhi Logo — Manual Elements">
<div class="shape pin-point"></div>
<div class="shape pin-inner"></div>
<div class="shape door-frame"></div>
<div class="shape door-opening"></div>
<div class="shape path-dot"></div>
<div class="word-city">City</div>
<div class="word-sakhi">Sakhi</div>
<div class="tagline">YOUR FIRST FRIEND IN A NEW CITY</div>
</div>
</body></html>
